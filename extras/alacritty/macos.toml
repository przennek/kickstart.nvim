# Alacritty on macOS for this Neovim config: Cmd+<key> works like in IntelliJ on the Mac.
# Cmd+<key> is sent as Alt+<key> (the Linux keymap of this config), for every key Neovim maps;
# Cmd+C / Cmd+V / Cmd+Q / Cmd+M / Cmd+Tab stay macOS (Cmd+H/J/K/L = splits). Option works as Alt too.
# Install: cp extras/alacritty/macos.toml ~/.config/alacritty/alacritty.toml

[terminal]
# login shell, so Homebrew's tmux is on the PATH
shell = { program = "/bin/zsh", args = ["-lc", "tmux attach -t main || tmux new -s main"] }

[window]
option_as_alt = "Both"

[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 14

[keyboard]
bindings = [
  # IntelliJ keys a terminal can't send (same as linux.toml)
  { key = "P", mods = "Control|Shift", chars = "\u001bh" },
  { key = "N", mods = "Control|Shift", chars = "\u001bl" },
  # Alt+Shift+F12 (Hide All Windows) has no code tmux can pass on; send Ctrl+Shift+F12 instead
  { key = "F12", mods = "Alt|Shift", chars = "\u001b[24;6~" },
  # Ctrl+Shift+M (Maximize Editor in Split) is Enter for a terminal; send Alt+Shift+M instead
  { key = "M", mods = "Control|Shift", chars = "\u001bM" },
  # More IntelliJ keys a terminal can't send, as Ctrl+Shift+F1…F7 (Neovim: F37…F43, idea_keys.lua)
  { key = "Tab", mods = "Control", chars = "\u001b[1;6P" },          # Switcher
  { key = "Tab", mods = "Control|Shift", chars = "\u001b[1;6Q" },    # Switcher (back)
  { key = "F", mods = "Control|Shift", chars = "\u001b[1;6R" },      # Find in Path
  { key = "Enter", mods = "Control", chars = "\u001b[1;6S" },        # Generate / New…
  { key = "R", mods = "Control|Shift", chars = "\u001b[15;6~" },     # Replace in Path
  { key = "B", mods = "Control|Shift", chars = "\u001b[17;6~" },     # Go to Type Declaration
  { key = "M", mods = "Control|Alt", chars = "\u001b[18;6~" },       # Extract Method
  # Cmd+<key> = Alt+<key>
  { key = "A", mods = "Command", chars = "\u001ba" },
  { key = "B", mods = "Command", chars = "\u001bb" },
  { key = "D", mods = "Command", chars = "\u001bd" },
  { key = "E", mods = "Command", chars = "\u001be" },
  { key = "F", mods = "Command", chars = "\u001bf" },
  { key = "N", mods = "Command", chars = "\u001bn" },
  { key = "O", mods = "Command", chars = "\u001bo" },
  { key = "P", mods = "Command", chars = "\u001bp" },
  { key = "R", mods = "Command", chars = "\u001br" },
  { key = "S", mods = "Command", chars = "\u001bs" },
  { key = "T", mods = "Command", chars = "\u001bt" },
  { key = "U", mods = "Command", chars = "\u001bu" },
  { key = "W", mods = "Command", chars = "\u001bw" },
  # Cmd+H/J/K/L move between splits (and tmux panes), like Ctrl+H/J/K/L
  { key = "H", mods = "Command", chars = "\u0008" },
  { key = "J", mods = "Command", chars = "\n" },
  { key = "K", mods = "Command", chars = "\u000b" },
  { key = "L", mods = "Command", chars = "\u000c" },
  { key = "A", mods = "Command|Shift", chars = "\u001bA" },
  { key = "C", mods = "Command|Shift", chars = "\u001bC" },
  { key = "E", mods = "Command|Shift", chars = "\u001bE" },
  { key = "L", mods = "Command|Shift", chars = "\u001bL" },
  { key = "M", mods = "Command|Shift", chars = "\u001bM" },
  { key = "N", mods = "Command|Shift", chars = "\u001bN" },
  { key = "O", mods = "Command|Shift", chars = "\u001bO" },
  { key = "T", mods = "Command|Shift", chars = "\u001bT" },
  { key = "V", mods = "Command|Shift", chars = "\u001bV" },
  { key = "W", mods = "Command|Shift", chars = "\u001bW" },
  { key = "0", mods = "Command", chars = "\u001b0" },
  { key = "1", mods = "Command", chars = "\u001b1" },
  { key = "2", mods = "Command", chars = "\u001b2" },
  { key = "3", mods = "Command", chars = "\u001b3" },
  { key = "4", mods = "Command", chars = "\u001b4" },
  { key = "5", mods = "Command", chars = "\u001b5" },
  { key = "6", mods = "Command", chars = "\u001b6" },
  { key = "7", mods = "Command", chars = "\u001b7" },
  { key = "8", mods = "Command", chars = "\u001b8" },
  { key = "9", mods = "Command", chars = "\u001b9" },
  { key = "/", mods = "Command", chars = "\u001b/" },
  { key = ".", mods = "Command", chars = "\u001b." },
  { key = "-", mods = "Command", chars = "\u001b-" },
  { key = "=", mods = "Command", chars = "\u001b=" },
  { key = "\\", mods = "Command", chars = "\u001b\\" },
  { key = "`", mods = "Command", chars = "\u001b`" },
  { key = ";", mods = "Command", chars = "\u001b;" },
  { key = "`", mods = "Command|Shift", chars = "\u001b~" },
  { key = "[", mods = "Command|Shift", chars = "\u001b{" },
  { key = "]", mods = "Command|Shift", chars = "\u001b}" },
  { key = "-", mods = "Command|Shift", chars = "\u001b_" },
  { key = "=", mods = "Command|Shift", chars = "\u001b+" },
  # Alacritty matches the character with Shift applied ({ for Shift+[), so both spellings
  { key = "~", mods = "Command|Shift", chars = "\u001b~" },
  { key = "{", mods = "Command|Shift", chars = "\u001b{" },
  { key = "}", mods = "Command|Shift", chars = "\u001b}" },
  { key = "_", mods = "Command|Shift", chars = "\u001b_" },
  { key = "+", mods = "Command|Shift", chars = "\u001b+" },
  { key = ",", mods = "Command", chars = "\u001b\u0013" },  # Settings (Cmd+,) = Ctrl+Alt+S
  { key = "Enter", mods = "Command", chars = "\u001b\r" },  # Show Context Actions
  { key = "Home", mods = "Command", chars = "\u001b[1;3H" },  # Navigation Bar
  { key = "ArrowUp", mods = "Command|Shift", chars = "\u001b[1;4A" },  # Move Statement Up
  { key = "ArrowDown", mods = "Command|Shift", chars = "\u001b[1;4B" },  # Move Statement Down
  { key = "Backspace", mods = "Command|Shift", chars = "\u001b\u007f" },  # Jump to Last Change
  { key = "F1", mods = "Command", chars = "\u001b[1;3P" },
  { key = "F2", mods = "Command", chars = "\u001b[1;3Q" },
  { key = "F3", mods = "Command", chars = "\u001b[1;3R" },
  { key = "F7", mods = "Command", chars = "\u001b[18;3~" },
  { key = "F8", mods = "Command", chars = "\u001b[19;3~" },
  { key = "F9", mods = "Command", chars = "\u001b[20;3~" },
  { key = "F11", mods = "Command", chars = "\u001b[23;3~" },
  { key = "F12", mods = "Command", chars = "\u001b[24;3~" },
  { key = "F12", mods = "Command|Shift", chars = "\u001b[24;6~" },  # Hide All Windows
  { key = "M", mods = "Command|Alt", chars = "\u001b[18;6~" },  # Extract Method
  # Other Cmd+Option shortcuts arrive in Neovim as Ctrl+Alt+F1…F8 (lua/pc/idea_keys.lua, surround_with.lua)
  { key = "V", mods = "Command|Alt", chars = "\u001b[1;7P" },  # Introduce Variable
  { key = "C", mods = "Command|Alt", chars = "\u001b[1;7Q" },  # Introduce Constant
  { key = "Z", mods = "Command|Alt", chars = "\u001b[1;7R" },  # Rollback
  { key = "K", mods = "Command|Alt", chars = "\u001b[1;7S" },  # Commit and Push
  { key = "I", mods = "Command|Alt", chars = "\u001b[15;7~" },  # Auto-Indent Lines
  { key = "E", mods = "Command|Alt", chars = "\u001b[17;7~" },  # Database: query history
  { key = "C", mods = "Command|Alt|Shift", chars = "\u001b[18;7~" },  # Copy Reference
  { key = "T", mods = "Command|Alt", chars = "\u001b[19;7~" },  # Surround With
  # Back / Forward also on Ctrl+Cmd+P / Ctrl+Cmd+N, as in the IDEA keymap
  { key = "P", mods = "Control|Command", chars = "\u001bh" },
  { key = "N", mods = "Control|Command", chars = "\u001bl" },
]
